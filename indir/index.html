<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kokoreççi</title>

<script>
/* ------------------------------------------------------------------
   AYARLAR — yalnizca bu ucunu doldur.

   APP_ID    App Store Connect -> App Information -> Apple ID (sadece rakam)
             Bos birakilirsa sayfa yonlendirme YAPMAZ, "cok yakinda" gosterir.
   PROVIDER  ASC -> App Analytics -> Acquisition -> Campaigns bolumunde
             uretilen kampanya linkindeki pt= degeri. Bos olabilir.
   PIXEL     Meta Pixel kimligi. Bos olabilir.
   ------------------------------------------------------------------ */
var APP_ID   = "6811690345";
var PROVIDER = "";
var PIXEL    = "";

/* Reklamda linki soyle ver:  .../indir/?k=meta1
   ?k= degeri Apple'in ct= kampanya etiketine gecer, boylece hangi
   reklamdan kac indirme geldigini App Store Connect'te gorursun.    */
var params = new URLSearchParams(location.search);
var kampanya = (params.get("k") || "reklam").replace(/[^A-Za-z0-9_.-]/g, "").slice(0, 40);

var hedef = "";
if (APP_ID) {
  hedef = "https://apps.apple.com/tr/app/id" + APP_ID + "?mt=8&ct=" + encodeURIComponent(kampanya);
  if (PROVIDER) hedef += "&pt=" + encodeURIComponent(PROVIDER);
}
</script>

<style>
  :root{
    --navy:#1A2133; --panel:#232C42; --edge:#0A0E18;
    --gold:#F2B233; --cream:#E8DCC0; --dim:#9BA6BC;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--navy); color:var(--cream);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    text-align:center;
  }
  .kart{max-width:420px}
  .ikon{
    width:120px; height:120px; border-radius:26px; margin:0 auto 22px;
    background:var(--panel); border:1px solid var(--edge); object-fit:cover;
  }
  h1{font-size:30px; margin:0 0 6px; color:var(--gold)}
  p{color:var(--dim); margin:0 0 26px}
  .dugme{
    display:inline-block; background:var(--gold); color:#1A2133;
    font-size:18px; font-weight:700; text-decoration:none;
    padding:15px 34px; border-radius:999px;
  }
  .not{margin-top:26px; font-size:14px; color:var(--dim)}
  .not a{color:var(--gold)}
</style>
</head>
<body>
<div class="kart">

  <img class="ikon" src="../icon.png" alt="Kokoreççi" onerror="this.style.display='none'">
  <h1>Kokoreççi</h1>

  <div id="hazir" hidden>
    <p>App Store açılıyor…</p>
    <a class="dugme" id="link" href="#">App Store'da Aç</a>
  </div>

  <div id="yakinda">
    <p>Gece büfesi simülatörü. Çok yakında App Store'da.</p>
    <a class="dugme" href="../">Haberdar ol</a>
  </div>

  <p class="not"><a href="../">Destek</a> · <a href="../gizlilik.html">Gizlilik</a></p>
</div>

<script>
if (PIXEL) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL);
  fbq('track', 'PageView');
  fbq('trackCustom', 'StoreRedirect', { kampanya: kampanya });
}

if (hedef) {
  document.getElementById("yakinda").hidden = true;
  document.getElementById("hazir").hidden = false;
  document.getElementById("link").href = hedef;
  /* Pixel'in istegi gitsin diye kisa bir gecikme, sonra magazaya. */
  setTimeout(function () { location.replace(hedef); }, PIXEL ? 350 : 0);
}
</script>
</body>
</html>
